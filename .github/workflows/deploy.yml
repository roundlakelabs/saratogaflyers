name: Build and deploy site

on:
  push:
    branches: [main]
  # Pull requests from this repo get a preview deploy on a *.pages.dev URL.
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly rebuild so past events drop off the home page.
    # 09:10 UTC is 5:10 AM EDT / 4:10 AM EST.
    - cron: "10 9 * * *"

permissions:
  contents: read
  deployments: write

# One deploy per branch at a time; let an in-progress deploy finish.
concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # Secrets aren't available to pull requests from forks, so skip those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      # Deploys to the "main" branch are production; any other branch name
      # becomes a preview at <branch>.saratogaflyers.pages.dev.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy _site --project-name=saratogaflyers --branch=${{ github.head_ref || github.ref_name }}
